version: '3.8'

services:
  # ==========================================
  # Ollama: Modelos de Texto / LLM
  # ==========================================
  ollama:
    container_name: ollama
    image: ollama/ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - C:/ollama-webui/ollama-data:/root/.ollama
      - C:/ollama-webui/ollama-model:/llama3
    environment:
      - OLLAMA_MODELS=llama3,qwen2.5-coder
      # Libera a VRAM da GPU logo apos responder para nao concorrer com o gerador de video
      - OLLAMA_KEEP_ALIVE=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ==========================================
  # Open WebUI: Interface Web para Chat / LLM
  # ==========================================
  open-webui:
    container_name: open-webui
    image: ghcr.io/open-webui/open-webui:main
    restart: always
    ports:
      - "3001:8080"
    volumes:
      - C:/ollama-webui/webui-db:/app/backend/data
    environment:
      - OLLAMA_API_BASE_URL=http://ollama:11434
    depends_on:
      - ollama

  # ==========================================
  # ComfyUI: Criacao e Geracao de Videos e Imagens
  # ==========================================
  comfyui:
    container_name: comfyui
    image: yanwk/comfyui-boot:cu126-slim
    restart: unless-stopped
    ports:
      - "8188:8188"
    environment:
      # Otimizacao especifica para RTX 2060 (6GB VRAM):
      # --lowvram: ativa offload automatico de pesos para os 32GB de RAM do sistema
      # --preview-method auto: previne travamentos durante a geracao de frames
      - CLI_ARGS=--listen 0.0.0.0 --port 8188 --lowvram --preview-method auto
      - PYTORCH_CUDA_ALLOC_CONF=garbage_collection_threshold:0.6,max_split_size_mb:128
    volumes:
      - ./storage/comfyui/cache/dot-cache:/root/.cache
      - ./storage/comfyui/cache/dot-config:/root/.config
      - ./storage/comfyui/nodes/dot-local:/root/.local
      - ./storage/comfyui/custom_nodes:/root/ComfyUI/custom_nodes
      - ./storage/comfyui/models:/root/ComfyUI/models
      - ./storage/comfyui/hf-hub:/root/.cache/huggingface/hub
      - ./storage/comfyui/torch-hub:/root/.cache/torch/hub
      - ./storage/comfyui/input:/root/ComfyUI/input
      - ./storage/comfyui/output:/root/ComfyUI/output
      - ./storage/comfyui/user:/root/ComfyUI/user
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
